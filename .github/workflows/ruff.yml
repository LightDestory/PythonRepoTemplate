name: Ruff

on:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ruff.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./src"

      - name: Check formatting
        run: ruff format --check --diff
